name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (sizing engine, cost, scenario pipeline)
        run: npm test
      - name: Install Chromium for UI tests
        run: npx playwright install --with-deps chromium
      - name: UI tests (every preset x every tab, compare + report)
        run: npm run test:ui
